<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>作者检索 - 作者管理应用系统</title>

    <link rel="stylesheet" href="css/ios-navigation.css">
    <link rel="stylesheet" href="css/ios-components.css">
    <link rel="stylesheet" href="css/gesture-system.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--ios-bg-secondary);
            color: var(--ios-text);
            min-height: 100vh;
            padding-bottom: 60px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .ios-header-large {
            background: var(--ios-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background-color: rgba(255, 255, 255, 0.92);
            padding: 0 var(--ios-space-4) var(--ios-space-2);
            border-bottom: 0.5px solid var(--ios-separator-opaque);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .ios-header-large-title {
            font-size: var(--ios-text-2xl);
            font-weight: var(--ios-weight-bold);
            color: var(--ios-text);
            margin-top: var(--ios-space-2);
            padding-bottom: var(--ios-space-2);
            letter-spacing: -0.02em;
        }

        .filter-section {
            background: var(--ios-bg);
            margin: var(--ios-space-3) var(--ios-space-4);
            border-radius: var(--ios-radius-3);
            overflow: hidden;
            box-shadow: var(--ios-shadow-card);
        }

        .filter-toggle-btn-main {
            width: 100%;
            padding: var(--ios-space-3) var(--ios-space-4);
            background: var(--ios-gray-bg);
            border: none;
            border-radius: var(--ios-radius-2);
            color: var(--ios-blue);
            font-size: var(--ios-text-lg);
            font-weight: var(--ios-weight-medium);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color var(--ios-duration-fast) var(--ios-ease);
        }

        .filter-toggle-btn-main:active {
            background: var(--ios-gray-bg);
        }

        .filter-panel {
            display: none;
            padding: var(--ios-space-4);
        }

        .filter-panel.show {
            display: block;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .filter-item {
            margin-bottom: 12px;
        }

        .filter-item.full-width {
            grid-column: span 2;
        }

        .filter-item label {
            display: block;
            font-size: 13px;
            color: var(--ios-gray);
            margin-bottom: 6px;
        }

        .filter-item input,
        .filter-item select {
            width: 100%;
            padding: 11px 16px;
            border: none;
            border-radius: var(--ios-radius-2);
            font-size: 15px;
            background: var(--ios-gray-bg);
            color: var(--ios-text);
        }

        .filter-item input:focus,
        .filter-item select:focus {
            outline: none;
            background: var(--ios-bg);
        }

        .filter-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: var(--ios-space-3);
            padding: var(--ios-space-3) var(--ios-space-4);
            background: var(--ios-bg);
            margin: 0 var(--ios-space-4) var(--ios-space-3);
            border-radius: var(--ios-radius-3);
            box-shadow: var(--ios-shadow-card);
        }

        .stats-bar::-webkit-scrollbar {
            display: none;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1 1 auto;
            min-width: 70px;
            max-width: 100px;
            padding: var(--ios-space-3) var(--ios-space-4);
            background: var(--ios-gray-bg);
            border-radius: var(--ios-radius-2);
        }

        .stat-item .label {
            font-size: var(--ios-text-xs);
            color: var(--ios-gray);
        }

        .stat-item .value {
            font-size: var(--ios-text-xl);
            font-weight: var(--ios-weight-semibold);
            color: var(--ios-blue);
        }

        .card-list {
            padding: 0 var(--ios-space-4);
        }

        .ios-list {
            background: var(--ios-bg);
            border-radius: var(--ios-radius-3);
            margin-bottom: var(--ios-space-3);
            overflow: hidden;
            box-shadow: var(--ios-shadow-card);
        }

        .teacher-item {
            display: flex;
            align-items: center;
            padding: var(--ios-space-3) var(--ios-space-4);
            min-height: 44px;
            cursor: pointer;
            position: relative;
            transition: background-color var(--ios-duration-fast) var(--ios-ease);
            -webkit-tap-highlight-color: transparent;
        }

        .teacher-item:active {
            background: var(--ios-gray-bg);
        }

        .teacher-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--ios-gray);
            border-radius: 50%;
            margin-right: var(--ios-space-3);
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--ios-duration-fast) var(--ios-ease);
            background: var(--ios-bg);
        }

        .teacher-checkbox.checked {
            background: var(--ios-blue);
            border-color: var(--ios-blue);
        }

        .teacher-checkbox.checked::after {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        .teacher-item.select-mode {
            padding-left: var(--ios-space-3);
        }

        .teacher-item.select-mode .teacher-checkbox {
            display: flex;
        }

        .teacher-item:not(.select-mode) .teacher-checkbox {
            display: none;
        }

        .teacher-avatar {
            width: 40px;
            height: 40px;
            border-radius: var(--ios-radius-2);
            background: var(--ios-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: var(--ios-text-lg);
            font-weight: var(--ios-weight-semibold);
            margin-right: var(--ios-space-3);
            flex-shrink: 0;
        }

        .teacher-content {
            flex: 1;
            min-width: 0;
        }

        .teacher-name {
            font-size: var(--ios-text-lg);
            font-weight: var(--ios-weight-normal);
            color: var(--ios-text);
            display: flex;
            align-items: center;
            gap: var(--ios-space-2);
        }

        .academician-badge {
            display: inline-block;
            padding: 2px var(--ios-space-2);
            background: var(--ios-purple);
            color: white;
            border-radius: var(--ios-radius-full);
            font-size: var(--ios-text-xs);
            font-weight: var(--ios-weight-medium);
        }

        .teacher-org {
            font-size: var(--ios-text-sm);
            color: var(--ios-gray);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .teacher-status {
            display: flex;
            gap: var(--ios-space-2);
            margin-top: var(--ios-space-1);
        }

        .teacher-chevron {
            width: 8px;
            height: 13px;
            margin-left: var(--ios-space-2);
            color: var(--ios-gray);
            flex-shrink: 0;
        }

        .ios-pull-refresh {
            position: relative;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            min-height: calc(100vh - 60px);
        }

        .ios-modal-overlay.warning-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .ios-modal-overlay.warning-modal.show {
            display: flex;
        }

        .ios-modal.warning-modal-content {
            background: var(--ios-bg);
            border-radius: var(--ios-radius-3);
            width: 270px;
            overflow: hidden;
            box-shadow: var(--ios-shadow-modal);
        }

        .ios-modal-header {
            padding: var(--ios-space-4) var(--ios-space-4) var(--ios-space-1);
            text-align: center;
        }

        .ios-modal-title {
            font-size: var(--ios-text-lg);
            font-weight: var(--ios-weight-semibold);
            color: var(--ios-text);
        }

        .ios-modal-body {
            padding: var(--ios-space-1) var(--ios-space-4) var(--ios-space-4);
        }

        .ios-modal-text {
            font-size: var(--ios-text-sm);
            color: var(--ios-gray-dark);
            line-height: var(--ios-leading-normal);
        }

        .warning-box {
            padding: var(--ios-space-3);
            border-radius: var(--ios-radius-2);
            margin-top: var(--ios-space-2);
        }

        .warning-box.high {
            background: rgba(255, 59, 48, 0.1);
        }

        .warning-box.medium {
            background: rgba(255, 149, 0, 0.1);
        }

        .warning-type {
            font-size: var(--ios-text-base);
            font-weight: var(--ios-weight-semibold);
            margin-bottom: var(--ios-space-2);
        }

        .warning-box.high .warning-type {
            color: var(--ios-red);
        }

        .warning-box.medium .warning-type {
            color: var(--ios-orange);
        }

        .ios-modal-footer {
            display: flex;
            border-top: none;
        }

        .ios-modal-btn {
            flex: 1;
            padding: var(--ios-space-3) var(--ios-space-4);
            font-size: var(--ios-text-lg);
            font-weight: var(--ios-weight-medium);
            text-align: center;
            cursor: pointer;
            color: var(--ios-blue);
            transition: background-color var(--ios-duration-fast) var(--ios-ease);
        }

        .ios-modal-btn:active {
            background: var(--ios-gray-bg);
        }

        .select-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--ios-gray-bg);
            border: none;
            border-radius: var(--ios-radius-2);
            color: var(--ios-blue);
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color var(--ios-duration-fast) var(--ios-ease);
        }

        .select-btn:active {
            background: var(--ios-bg);
        }

        .select-btn.active {
            background: var(--ios-blue);
            color: white;
        }

        .select-action-bar {
            display: none;
            position: fixed;
            bottom: 70px;
            left: var(--ios-space-4);
            right: var(--ios-space-4);
            background: var(--ios-bg);
            border-radius: var(--ios-radius-3);
            padding: var(--ios-space-3) var(--ios-space-4);
            box-shadow: var(--ios-shadow-3);
            z-index: 40;
            align-items: center;
            justify-content: space-between;
        }

        .select-action-bar.show {
            display: flex;
        }

        .select-info {
            font-size: var(--ios-text-sm);
            color: var(--ios-text);
        }

        .select-info strong {
            color: var(--ios-blue);
            font-weight: var(--ios-weight-semibold);
        }

        .select-actions {
            display: flex;
            gap: var(--ios-space-2);
        }

        .ios-modal-large {
            width: 270px;
            max-width: 90vw;
        }

        .ios-modal-large .ios-modal-body {
            text-align: center;
            padding: var(--ios-space-3) var(--ios-space-4) var(--ios-space-4);
        }
    </style>
</head>
<body>
    <div class="ios-header-large">
        <div class="ios-header-large-title">作者检索</div>
    </div>

    <div class="ios-pull-refresh" id="pullRefreshContainer">

        <div class="filter-section">
            <button class="filter-toggle-btn-main ios-tap-feedback" onclick="toggleFilterPanel()">
                <span>多维度检索</span>
                <span id="filterArrow">▼</span>
            </button>

            <div class="filter-panel" id="filterPanel">
                <div class="filter-grid extended">
                    <div class="filter-item">
                        <label>作者姓名</label>
                        <input type="text" id="name" placeholder="请输入" class="ios-input">
                    </div>
                    <div class="filter-item">
                        <label>所属单位</label>
                        <input type="text" id="organization" placeholder="请输入" class="ios-input">
                    </div>
                    <div class="filter-item">
                        <label>所属地区</label>
                        <select id="region" class="ios-input">
                            <option value="">请选择</option>
                            <option value="11">北京</option>
                            <option value="12">天津</option>
                            <option value="13">河北</option>
                            <option value="14">山西</option>
                            <option value="15">内蒙古</option>
                            <option value="21">辽宁</option>
                            <option value="22">吉林</option>
                            <option value="23">黑龙江</option>
                            <option value="31">上海</option>
                            <option value="32">江苏</option>
                            <option value="33">浙江</option>
                            <option value="34">安徽</option>
                            <option value="35">福建</option>
                            <option value="36">江西</option>
                            <option value="37">山东</option>
                            <option value="41">河南</option>
                            <option value="42">湖北</option>
                            <option value="43">湖南</option>
                            <option value="44">广东</option>
                            <option value="45">广西</option>
                            <option value="46">海南</option>
                            <option value="50">重庆</option>
                            <option value="51">四川</option>
                            <option value="52">贵州</option>
                            <option value="53">云南</option>
                            <option value="54">西藏</option>
                            <option value="61">陕西</option>
                            <option value="62">甘肃</option>
                            <option value="63">青海</option>
                            <option value="64">宁夏</option>
                            <option value="65">新疆</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>学科</label>
                        <input type="text" id="subject" placeholder="请输入" class="ios-input">
                    </div>
                    <div class="filter-item">
                        <label>专业方向</label>
                        <input type="text" id="specialty" placeholder="请输入" class="ios-input">
                    </div>
                    <div class="filter-item">
                        <label>职称等级</label>
                        <select id="titleLevel" class="ios-input">
                            <option value="">请选择</option>
                            <option value="4">正高级</option>
                            <option value="3">副高级</option>
                            <option value="2">中级</option>
                            <option value="1">初级</option>
                            <option value="9">其它</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>职称称谓</label>
                        <select id="titleName" class="ios-input">
                            <option value="">请选择</option>
                            <option value="4">教授</option>
                            <option value="3">副教授</option>
                            <option value="2">讲师</option>
                            <option value="1">助教</option>
                            <option value="9">其它</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>擅长领域</label>
                        <input type="text" id="expertise" placeholder="请输入擅长领域关键词" class="ios-input">
                    </div>
                    <div class="filter-item">
                        <label>是否有合作</label>
                        <select id="hasCooperation" class="ios-input">
                            <option value="">请选择</option>
                            <option value="1">已合作</option>
                            <option value="0">未合作</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>是否为院士</label>
                        <select id="isAcademician" class="ios-input">
                            <option value="">请选择</option>
                            <option value="1">有院士</option>
                            <option value="0">无院士</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>关注状态</label>
                        <select id="followStatus" class="ios-input">
                            <option value="">请选择</option>
                            <option value="1">已关注</option>
                            <option value="0">未关注</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>预警状态</label>
                        <select id="hasWarning" class="ios-input">
                            <option value="">请选择</option>
                            <option value="1">有预警</option>
                            <option value="0">无预警</option>
                        </select>
                    </div>
                    <div class="filter-item full-width">
                        <label>逻辑模式</label>
                        <select id="logicMode" class="ios-input">
                            <option value="and">且（满足全部条件）</option>
                            <option value="or">或（满足任一条件）</option>
                        </select>
                    </div>
                </div>

                <div class="filter-buttons">
                    <button class="ios-btn-capsule gray" onclick="resetFilter()">重置</button>
                    <button class="ios-btn-capsule primary" onclick="searchTeachers()">搜索</button>
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="label">检索结果</div>
                <div class="value" id="statTotal">1,234</div>
            </div>
            <div class="stat-item">
                <div class="label">合作作者</div>
                <div class="value" id="statCooperation">456</div>
            </div>
            <div class="stat-item">
                <div class="label">院士</div>
                <div class="value" id="statAcademician">23</div>
            </div>
            <div class="stat-item">
                <div class="label">正高级</div>
                <div class="value" id="statSenior">678</div>
            </div>
            <div class="stat-item">
                <div class="label">副高级</div>
                <div class="value" id="statViceSenior">234</div>
            </div>
            <button class="select-btn ios-tap-feedback" id="selectModeBtn" onclick="toggleSelectMode()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
            </button>
            <button class="export-btn has-permission" id="exportBtn" onclick="handleExportClick()">
                <svg class="export-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
            </button>
        </div>

        <div class="sort-bar">
            <button class="sort-item active" data-field="name" data-default-order="asc">姓名</button>
            <button class="sort-item" data-field="organization" data-default-order="asc">单位</button>
            <button class="sort-item" data-field="titleLevel" data-default-order="desc">职称</button>
            <button class="sort-item" data-field="region" data-default-order="asc">地区</button>
            <button class="sort-item" data-field="cooperationCount" data-default-order="desc">合作次数</button>
            <button class="sort-item" data-field="followedAt" data-default-order="desc">关注时间</button>
        </div>

        <div class="select-action-bar" id="selectActionBar">
            <div class="select-info">
                <span>已选择 <strong id="selectedCount">0</strong> 位作者</span>
            </div>
            <div class="select-actions">
                <button class="ios-btn-capsule gray small" onclick="selectAllTeachers()">全选</button>
                <button class="ios-btn-capsule gray small" onclick="clearSelection()">取消</button>
                <button class="ios-btn-capsule secondary small" onclick="batchFollowTeachers()">批量关注</button>
            </div>
        </div>

        <div class="card-list" id="cardList">
        </div>

        <div class="load-more-section" id="loadMoreSection">
            <div class="load-more-text">上拉加载更多</div>
        </div>
    </div>

    <div class="ios-modal-overlay warning-modal" id="warningModal">
        <div class="ios-modal warning-modal-content">
            <div class="ios-modal-header">
                <div class="ios-modal-title">预警信息</div>
            </div>
            <div class="ios-modal-body">
                <div class="ios-modal-text">
                    <div><strong>作者：</strong><span id="modalAuthor"></span></div>
                    <div><strong>所属单位：</strong><span id="modalOrg"></span></div>
                </div>
                <div class="warning-box" id="warningBox">
                    <div class="warning-type" id="warningType"></div>
                    <div class="ios-modal-text" id="warningDetail"></div>
                </div>
            </div>
            <div class="ios-modal-footer">
                <div class="ios-modal-btn" onclick="closeWarningModal()">关闭</div>
            </div>
        </div>
    </div>

    <div class="ios-modal-overlay" id="exportModal">
        <div class="ios-modal">
            <div class="ios-modal-header">
                <div class="ios-modal-title">导出作者数据</div>
            </div>
            <div class="ios-modal-body">
                <div class="ios-modal-text">
                    导出数量（最大1000条）
                </div>
                <div class="export-count-input" style="margin-top: 12px;">
                    <input type="number" id="exportCount" value="100" min="1" max="1000" style="width: 100px; padding: 8px 12px; border: 1px solid var(--ios-separator-opaque); border-radius: var(--ios-radius-2); font-size: 15px;">
                    <span style="color: var(--ios-gray); font-size: 14px;"> 条</span>
                </div>
            </div>
            <div class="ios-modal-footer">
                <div class="ios-modal-btn cancel" onclick="closeExportModal()">取消</div>
                <div class="ios-modal-btn confirm" onclick="confirmExport()">确认导出</div>
            </div>
        </div>
    </div>

    <nav class="ios-tab-nav">
        <a href="teacher-list.html" class="ios-tab-item active" data-tab="teachers">
            <div class="ios-tab-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </div>
            <div class="ios-tab-label">作者检索</div>
        </a>
        <a href="university-list.html" class="ios-tab-item" data-tab="universities">
            <div class="ios-tab-icon">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script src="js/pc-data-dict.js"></script>

    <script src="js/ios-navigation.js"></script>
    <script src="js/pull-refresh.js"></script>
    <script src="js/gesture-handler.js"></script>
    <script src="js/sort-manager.js"></script>
    <script src="js/export-handler.js"></script>

    <script>
        if (window.titleLevelWeight) {
            window.titleLevelWeight["其它"] = 0;
            window.titleLevelWeight["4"] = 4;
            window.titleLevelWeight["3"] = 3;
            window.titleLevelWeight["2"] = 2;
            window.titleLevelWeight["1"] = 1;
            window.titleLevelWeight["9"] = 0;
        }

        const teachersData = [
            { id: "1001", authorId: "A001", name: "张三", gender: "M", unit: "北京大学信息科学技术学院", province: "11", subject: "工学", titleName: "院士", specialty: "计算机科学与技术", expertise: "人工智能、机器学习", cooperationStatus: "1", warningStatus: "论文预警", followStatus: "1" },
            { id: "1002", authorId: "A002", name: "李四", gender: "M", unit: "清华大学", province: "11", subject: "理学", titleName: "4", specialty: "数学", expertise: "数值分析", cooperationStatus: "1", warningStatus: "", followStatus: "1" },
            { id: "1003", authorId: "A003", name: "王五", gender: "M", unit: "华为技术有限公司", province: "44", subject: "工学", titleName: "4", specialty: "通信", expertise: "5G通信技术", cooperationStatus: "0", warningStatus: "", followStatus: "0" },
            { id: "1004", authorId: "A004", name: "赵六", gender: "M", unit: "中国科学院计算技术研究所", province: "11", subject: "工学", titleName: "院士", specialty: "人工智能", expertise: "深度学习、神经网络", cooperationStatus: "1", warningStatus: "", followStatus: "0" },
            { id: "1005", authorId: "A005", name: "钱七", gender: "F", unit: "教育部", province: "11", subject: "教育学", titleName: "3", specialty: "教育管理", expertise: "教育政策研究", cooperationStatus: "0", warningStatus: "", followStatus: "0" },
            { id: "1006", authorId: "A006", name: "孙八", gender: "M", unit: "复旦大学", province: "31", subject: "医学", titleName: "4", specialty: "临床医学", expertise: "心血管疾病", cooperationStatus: "1", warningStatus: "", followStatus: "1" },
            { id: "1007", authorId: "A007", name: "周九", gender: "M", unit: "上海交通大学", province: "31", subject: "工学", titleName: "3", specialty: "机械", expertise: "机械设计", cooperationStatus: "0", warningStatus: "", followStatus: "0" },
            { id: "1008", authorId: "A008", name: "吴十", gender: "M", unit: "浙江大学", province: "33", subject: "理学", titleName: "院士", specialty: "物理", expertise: "量子物理", cooperationStatus: "1", warningStatus: "", followStatus: "0" },
            { id: "1009", authorId: "A009", name: "郑十一", gender: "M", unit: "南京大学", province: "32", subject: "文学", titleName: "4", specialty: "中文", expertise: "古典文学", cooperationStatus: "1", warningStatus: "", followStatus: "0" },
            { id: "1010", authorId: "A010", name: "陈十二", gender: "F", unit: "武汉大学", province: "42", subject: "工学", titleName: "3", specialty: "水利", expertise: "水利工程", cooperationStatus: "0", warningStatus: "", followStatus: "0" }
        ];

        let allData = [...teachersData];

        let selectMode = false;
        let selectedTeachers = new Set();

        function toggleSelectMode() {
            selectMode = !selectMode;
            const btn = document.getElementById('selectModeBtn');
            const actionBar = document.getElementById('selectActionBar');

            btn.classList.toggle('active', selectMode);
            actionBar.classList.toggle('show', selectMode);

            document.querySelectorAll('.teacher-item').forEach(item => {
                item.classList.toggle('select-mode', selectMode);
            });

            if (!selectMode) {
                clearSelection();
            }
        }

        function toggleTeacherSelection(id) {
            if (selectedTeachers.has(id)) {
                selectedTeachers.delete(id);
            } else {
                selectedTeachers.add(id);
            }
            updateSelectedUI();
        }

        function selectAllTeachers() {
            allData.forEach(t => selectedTeachers.add(t.id));
            updateSelectedUI();
            updateAllCheckboxes();
        }

        function clearSelection() {
            selectedTeachers.clear();
            selectMode = false;
            document.getElementById('selectModeBtn').classList.remove('active');
            document.getElementById('selectActionBar').classList.remove('show');
            document.querySelectorAll('.teacher-item').forEach(item => {
                item.classList.remove('select-mode');
            });
            updateAllCheckboxes();
        }

        function updateSelectedUI() {
            document.getElementById('selectedCount').textContent = selectedTeachers.size;
        }

        function updateAllCheckboxes() {
            document.querySelectorAll('.teacher-checkbox').forEach(checkbox => {
                const id = checkbox.dataset.id;
                checkbox.classList.toggle('checked', selectedTeachers.has(id));
            });
        }

        function batchFollowTeachers() {
            if (selectedTeachers.size === 0) {
                alert('请先选择要关注的作者');
                return;
            }
            const count = selectedTeachers.size;
            const names = allData.filter(t => selectedTeachers.has(t.id)).map(t => t.name).slice(0, 5).join('、');
            const nameList = selectedTeachers.size > 5 ? names + '等' + selectedTeachers.size + '位作者' : names;
            if (confirm('确定要批量关注 ' + nameList + ' 吗？')) {
                allData.forEach(t => {
                    if (selectedTeachers.has(t.id)) {
                        t.followStatus = '1';
                    }
                });
                alert('已成功关注 ' + count + ' 位作者');
                clearSelection();
                renderList(allData);
            }
        }

        function toggleFilterPanel() {
            const panel = document.getElementById('filterPanel');
            const arrow = document.getElementById('filterArrow');
            panel.classList.toggle('show');
            arrow.textContent = panel.classList.contains('show') ? '▲' : '▼';
        }

        function resetFilter() {
            document.getElementById('name').value = '';
            document.getElementById('organization').value = '';
            document.getElementById('region').value = '';
            document.getElementById('subject').value = '';
            document.getElementById('specialty').value = '';
            document.getElementById('titleLevel').value = '';
            document.getElementById('titleName').value = '';
            document.getElementById('expertise').value = '';
            document.getElementById('hasCooperation').value = '';
            document.getElementById('isAcademician').value = '';
            document.getElementById('followStatus').value = '';
            allData = [...teachersData];
            currentPage = 1;
            renderList(allData);
            updateStats(allData);
            if (window.teacherSortManager) {
                window.teacherSortManager.reset();
            }
        }

        function searchTeachers() {
            const name = document.getElementById('name').value;
            const organization = document.getElementById('organization').value;
            const province = document.getElementById('region').value;
            const subject = document.getElementById('subject').value;
            const specialty = document.getElementById('specialty').value;
            const titleLevel = document.getElementById('titleLevel').value;
            const titleName = document.getElementById('titleName').value;
            const expertise = document.getElementById('expertise').value;
            const hasCooperation = document.getElementById('hasCooperation').value;
            const isAcademician = document.getElementById('isAcademician').value;
            const followStatus = document.getElementById('followStatus').value;

            let filteredData = teachersData.filter(t => {
                if (name && !t.name.includes(name)) return false;
                if (organization && !t.unit.includes(organization)) return false;
                if (province && t.province !== province) return false;
                if (subject && t.subject !== subject) return false;
                if (specialty && t.specialty !== specialty) return false;
                if (titleLevel && t.titleName !== titleLevel) return false;
                if (titleName && t.titleName !== titleName) return false;
                if (expertise && !t.expertise?.includes(expertise)) return false;
                if (hasCooperation && t.cooperationStatus !== hasCooperation) return false;
                if (isAcademician === '1' && t.titleName !== '院士') return false;
                if (isAcademician === '0' && t.titleName === '院士') return false;
                if (followStatus && t.followStatus !== followStatus) return false;
                return true;
            });

            allData = filteredData;
            currentPage = 1;
            renderList(filteredData);
            updateStats(filteredData);
        }

        function updateStats(data) {
            document.getElementById('statTotal').textContent = data.length;
            document.getElementById('statCooperation').textContent = data.filter(t => t.cooperationStatus === '1').length;
            document.getElementById('statAcademician').textContent = data.filter(t => t.titleName === '院士').length;
            document.getElementById('statSenior').textContent = data.filter(t => t.titleName === '4').length;
            document.getElementById('statViceSenior').textContent = data.filter(t => t.titleName === '3').length;
        }

        function renderList(data) {
            const cardList = document.getElementById('cardList');
            cardList.innerHTML = '';

            const list = document.createElement('div');
            list.className = 'ios-list';

            data.forEach(teacher => {
                const item = createTeacherItem(teacher);
                list.appendChild(item);
            });

            cardList.appendChild(list);
        }

        function createTeacherItem(teacher) {
            const item = document.createElement('div');
            item.className = 'teacher-item ios-tap-feedback';
            item.setAttribute('data-push-from', 'teacher-list-page');
            item.setAttribute('data-push-target', 'teacher-profile-page');
            item.dataset.id = teacher.id;

            const avatarText = teacher.name.charAt(0);

            const provinceName = getProvinceName(teacher.province);
            const genderName = teacher.gender === 'M' ? '男' : '女';
            const titleLevelName = getTitleLevelName(teacher.titleName);

            const cooperationBadge = teacher.cooperationStatus === '1'
                ? `<span class="ios-status-text success">有合作</span>`
                : `<span class="ios-status-text gray">无合作</span>`;

            const academicianBadge = teacher.titleName === '院士'
                ? `<span class="academician-badge">院士</span>`
                : '';

            const followBadge = teacher.followStatus === '1'
                ? `<span class="ios-status-text info">已关注</span>`
                : '';

            const warningBadge = teacher.warningStatus
                ? `<span class="ios-status-text warning">${teacher.warningStatus}</span>`
                : '';

            const checkbox = document.createElement('div');
            checkbox.className = 'teacher-checkbox';
            checkbox.dataset.id = teacher.id;
            if (selectedTeachers.has(teacher.id)) {
                checkbox.classList.add('checked');
            }

            checkbox.onclick = (e) => {
                e.stopPropagation();
                toggleTeacherSelection(teacher.id);
                checkbox.classList.toggle('checked', selectedTeachers.has(teacher.id));
            };

            const avatar = document.createElement('div');
            avatar.className = 'teacher-avatar';
            avatar.textContent = avatarText;

            const content = document.createElement('div');
            content.className = 'teacher-content';

            const educationName = getEducationLevelName(teacher.education);

            content.innerHTML = `
                <div class="teacher-name">
                    ${teacher.name}
                    ${academicianBadge}
                </div>
                <div class="teacher-org">${teacher.unit} · ${teacher.department || ''}</div>
                <div class="teacher-org">${provinceName} · ${titleLevelName} · ${educationName}</div>
                <div class="teacher-org">${teacher.subject} · ${teacher.specialty || ''}</div>
                <div class="teacher-status">
                    ${cooperationBadge}
                    ${followBadge}
                    ${warningBadge}
                </div>
            `;

            const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            chevron.setAttribute('class', 'teacher-chevron');
            chevron.setAttribute('viewBox', '0 0 8 13');
            chevron.setAttribute('fill', 'none');
            chevron.innerHTML = `<path d="M1 1l6 5.5L1 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;

            item.appendChild(checkbox);
            item.appendChild(avatar);
            item.appendChild(content);
            item.appendChild(chevron);

            item.onclick = () => {
                if (selectMode) {
                    toggleTeacherSelection(teacher.id);
                    checkbox.classList.toggle('checked', selectedTeachers.has(teacher.id));
                } else {
                    window.location.href = 'teacher-profile.html?id=' + teacher.authorId;
                }
            };

            return item;
        }

        function showWarningModal(name, organization, warning) {
            const modal = document.getElementById('warningModal');
            document.getElementById('modalAuthor').textContent = name;
            document.getElementById('modalOrg').textContent = organization;

            const warningBox = document.getElementById('warningBox');
            warningBox.className = 'warning-box ' + warning.level;

            document.getElementById('warningType').textContent = warning.type + '预警';
            document.getElementById('warningDetail').innerHTML = `
                <div>类型：${warning.content}</div>
                <div>内容：${warning.description}</div>
                <div>时间：${warning.date}</div>
            `;

            modal.classList.add('show');
        }

        function closeWarningModal() {
            document.getElementById('warningModal').classList.remove('show');
        }

        document.getElementById('warningModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeWarningModal();
            }
        });

        window.handleExportClick = function() {
            const exportModal = document.getElementById('exportModal');
            const defaultCount = Math.min(allData.length, 1000);
            document.getElementById('exportCount').value = defaultCount;
            exportModal.classList.add('show');
        };

        window.closeExportModal = function() {
            document.getElementById('exportModal').classList.remove('show');
        };

        window.confirmExport = function() {
            window.closeExportModal();

            const exportCountInput = document.getElementById('exportCount');
            let exportLimit = parseInt(exportCountInput.value) || 100;

            if (exportLimit < 1 || exportLimit > 1000) {
                alert('导出数量需在1-1000之间');
                return;
            }

            const dataToExport = (allData || []).slice(0, exportLimit);

            if (dataToExport.length === 0) {
                alert('无数据可导出');
                return;
            }

            const exportData = dataToExport.map((t, i) => {
                return {
                    '序号': i + 1,
                    '姓名': t.name || '',
                    '性别': t.gender === 'M' ? '男' : '女',
                    '所属单位': t.unit || '',
                    '所属地区': getProvinceName(t.province),
                    '学科': t.subject || '',
                    '职称等级': getTitleLevelName(t.titleName),
                    '职称称谓': getTitleLevelName(t.titleName),
                    '专业方向': t.specialty || '',
                    '擅长领域': t.expertise || '',
                    '合作状态': t.cooperationStatus === '1' ? '有合作' : '无合作',
                    '预警状态': t.warningStatus || '无预警',
                    '关注状态': t.followStatus === '1' ? '已关注' : '未关注'
                };
            });

            if (typeof XLSX !== 'undefined') {
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(exportData);
                ws['!cols'] = [
                    { wch: 8 },
                    { wch: 12 },
                    { wch: 6 },
                    { wch: 30 },
                    { wch: 12 },
                    { wch: 10 },
                    { wch: 12 },
                    { wch: 12 },
                    { wch: 20 },
                    { wch: 20 },
                    { wch: 10 },
                    { wch: 12 },
                    { wch: 10 }
                ];
                XLSX.utils.book_append_sheet(wb, ws, '作者检索');
                const filename = `作者检索结果_${new Date().toISOString().slice(0, 10)}.xlsx`;
                XLSX.writeFile(wb, filename);
                alert('导出成功！共导出 ' + dataToExport.length + ' 条数据');
            } else {
                alert('SheetJS库未加载，请刷新页面重试');
            }
        };

        window.initExportBtn = function(type) {
            const exportBtn = document.getElementById('exportBtn');
            if (exportBtn) {
                exportBtn.disabled = false;
            }
        };

        document.addEventListener('DOMContentLoaded', function() {
            renderList(teachersData);
            updateStats(teachersData);

            document.getElementById('selectedCount').textContent = '0';

            const sortManager = new SortManager('teacher', handleSort);
            sortManager.init();
            window.teacherSortManager = sortManager;

            initExportBtn('teacher');

            PaginationManager.init({
                containerSelector: '#pullRefreshContainer',
                totalItems: 100,
                onLoadMore: (page) => {
                    return new Promise((resolve) => {
                        setTimeout(() => {
                            const newTeachers = [];
                            const startIndex = (page - 1) * 20 + 11;
                            for (let i = 0; i < 20; i++) {
                                newTeachers.push({
                                    id: startIndex + i,
                                    name: "测试" + (startIndex + i),
                                    organization: "测试单位" + (startIndex + i),
                                    region: "北京",
                                    titleLevel: "中级",
                                    academician: null,
                                    cooperation: false,
                                    warning: null,
                                    followed: false
                                });
                            }
                            appendToList(newTeachers);
                            resolve(newTeachers);
                        }, 500);
                    });
                }
            });
        });

        function appendToList(newData) {
            const cardList = document.getElementById('cardList');
            const list = cardList.querySelector('.ios-list');
            if (!list) return;

            newData.forEach(teacher => {
                const item = createTeacherItem(teacher);
                list.appendChild(item);
            });
        }

        function handleSort(field, order) {
            let sortedData = [...allData];

            sortedData.sort((a, b) => {
                let valueA, valueB;

                switch (field) {
                    case 'name':
                        valueA = a.name || '';
                        valueB = b.name || '';
                        break;
                    case 'organization':
                        valueA = a.unit || '';
                        valueB = b.unit || '';
                        break;
                    case 'titleLevel':
                        valueA = titleLevelWeight[a.titleName] || 0;
                        valueB = titleLevelWeight[b.titleName] || 0;
                        break;
                    case 'region':
                        valueA = getProvinceName(a.province) || '';
                        valueB = getProvinceName(b.province) || '';
                        break;
                    case 'cooperationCount':
                        valueA = a.cooperationStatus === '1' ? Math.floor(Math.random() * 100) + 1 : 0;
                        valueB = b.cooperationStatus === '1' ? Math.floor(Math.random() * 100) + 1 : 0;
                        break;
                    case 'followedAt':
                        valueA = a.followStatus === '1' ? '2024-03-' + Math.floor(Math.random() * 28 + 1) : '';
                        valueB = b.followStatus === '1' ? '2024-03-' + Math.floor(Math.random() * 28 + 1) : '';
                        break;
                    default:
                        return 0;
                }

                if (order === 'asc') {
                    if (typeof valueA === 'string') {
                        return valueA.localeCompare(valueB, 'zh-CN');
                    }
                    return valueA - valueB;
                } else {
                    if (typeof valueA === 'string') {
                        return valueB.localeCompare(valueA, 'zh-CN');
                    }
                    return valueB - valueA;
                }
            });

            renderList(sortedData);
            updateStats(sortedData);
        }
    </script>
